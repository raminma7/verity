name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: verity_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv && uv pip install --python .venv/bin/python -e . pytest pytest-asyncio httpx fakeredis ruff
      - run: .venv/bin/ruff check app tests && .venv/bin/ruff format --check app tests
      - run: .venv/bin/pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: verity }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      VERITY_EMAIL_BACKEND: memory
      # No AI provider calls in CI: deterministic fake embeddings and answers through the real quota path.
      VERITY_LLM_PROVIDER: fake
      VERITY_EMBEDDING_PROVIDER: fake
      VERITY_STORAGE_DIR: /tmp/verity-storage
      VERITY_ADMIN_EMAIL: admin@example.com
      VERITY_ADMIN_PASSWORD: Admin-pass-123
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Start API
        working-directory: apps/api
        run: |
          uv venv .venv && uv pip install --python .venv/bin/python -e .
          .venv/bin/alembic upgrade head && .venv/bin/python -m app.seed
          nohup .venv/bin/uvicorn app.main:app --port 8000 > api.log 2>&1 &
          nohup .venv/bin/python -m app.worker > worker.log 2>&1 &
      - name: Build and start web
        working-directory: apps/web
        run: |
          npm ci && npx playwright install --with-deps chromium
          npm run build
          nohup npm start > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/sign-in >/dev/null && curl -sf http://localhost:8000/api/health >/dev/null && break; sleep 1; done
      - name: End-to-end tests
        working-directory: apps/web
        run: npm run test:e2e
      - name: Server logs
        if: failure()
        run: |
          echo "--- api.log"; tail -n 200 apps/api/api.log || true
          echo "--- worker.log"; tail -n 200 apps/api/worker.log || true
          echo "--- web.log"; tail -n 100 apps/web/web.log || true
